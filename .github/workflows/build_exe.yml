name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          $env:VERSION = $(git describe --tags --abbrev=0)
          $env:EXE_NAME = "scholarship_check$env:VERSION.exe"
          pyinstaller --onefile --name main main.py
          Move-Item -Path "dist/main.exe" -Destination $env:EXE_NAME

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/${{ env.EXE_NAME }}
          draft: true
          token: ${{ secrets.GHCR_PAT }}