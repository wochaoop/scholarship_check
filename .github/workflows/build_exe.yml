name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          $env:VERSION = $(git describe --tags --abbrev=0)
          $env:EXE_NAME = "scholarship_check-$env:VERSION.exe"
          pyinstaller --onefile -w --name main --icon=favicon.ico main.py
          Move-Item -Path "dist/main.exe" -Destination "dist/$env:EXE_NAME" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v2
        with:
          name: EXE
          path: dist/${{ env.EXE_NAME }}

  create-release:
    needs: build-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Download artifact
        uses: actions/download-artifact@v2
        with:
          name: EXE
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          draft: true
          token: ${{ secrets.GHCR_PAT }}