name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --name main main.py

      - name: Rename and Upload Release
        run: |
          $env:VERSION = $(git describe --tags --abbrev=0)
          Rename-Item -Path dist/main.exe -NewName dist/scholarship_check$env:VERSION.exe
        uses: actions/upload-artifact@v2
        with:
          name: scholarship_check*.exe
          path: dist/scholarship_check*.exe